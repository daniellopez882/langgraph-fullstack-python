name: CI

# There was no pipeline. The graph had no tools, the deployment auth accepted
# every caller, and the SSE stream put unescaped model output into the DOM.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check src tests

      - name: mypy
        run: mypy src/react_agent/config.py src/react_agent/sse.py src/react_agent/auth.py src/react_agent/graph.py

      - name: Tests
        run: pytest -q

      - name: The deployment must reject callers when a token is set
        # The old auth returned "default_user" for everyone on a model-spending
        # deployment. This asserts a configured token is actually enforced.
        run: |
          python - <<'PY'
          from react_agent import auth
          from react_agent.config import settings
          settings.AUTH_TOKEN = "ci-secret"
          assert auth.is_authorized("Bearer ci-secret") is True
          assert auth.is_authorized("Bearer wrong") is False
          assert auth.is_authorized(None) is False
          print("auth enforced")
          PY

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Bandit
        run: bandit -r src -ll -f screen

      - name: pip-audit
        run: pip-audit --strict
        continue-on-error: true  # advisory feed availability, not a code defect

      - name: No .env may be tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"; exit 1
          fi
          echo "clean"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t react-agent:ci .

      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id react-agent:ci -u)
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: The LangGraph server answers its readiness probe
        run: |
          docker run -d --name ra -p 2024:2024 -e ANTHROPIC_API_KEY=sk-ci-not-real react-agent:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:2024/ok >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:2024/ok
          docker logs ra | tail -15
          docker rm -f ra
